#version: '3.8'

services:
  # 1. Django Backend (running Daphne)
  backend:
    build: ./backend
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - redis
    env_file:
      - ./.env
    environment:
      - REDIS_HOST=redis
      - ALLOWED_HOSTS=*

  # 2. Redis Message Broker
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # 3. Vite Frontend
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
